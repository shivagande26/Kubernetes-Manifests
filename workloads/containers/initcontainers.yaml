apiVersion: v1
kind: Pod
metadata:
  name: init-demo
spec:
  initContainers:
    - name: app
      image: busybox:latest
      command: ['sh', '-c', 'nslookup ggooooogle.com']
  containers:
    - name: main-app
      image: nginx:latest
      ports:
        - containerPort: 80