apiVersion: v1
kind: Pod
metadata:
  name: sidecar-checker-demo
spec:
  initContainers:
    - name: uptime-sidecar
      image: alpine:latest
      restartPolicy: Always
      command: ['sh', '-c', 'apk add --no-cache curl && while true; do echo "Checking main app status..."; curl -I http://localhost:80; sleep 10; done']
  containers:
    - name: main-app
      image: nginx:latest
      ports:
        - containerPort: 80