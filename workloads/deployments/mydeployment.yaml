apiVersion: apps/v1
kind: Deployment
metadata:
  name: myappone
  labels:
    type: webapp
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: webapp
    spec:
      containers:
        - name: mywebapp
          image: nginx:1.28.1-alpine3.23
  replicas: 100
  selector:
    matchLabels:
      type: webapp