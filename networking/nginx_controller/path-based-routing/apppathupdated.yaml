apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: test-ingress
  labels:
    name: test-ingress
#  annotations:
#    nginx.ingress.kubernetes.io/whitelist-source-range: "45.112.185.214/32"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: datastore-fe-svc
                port:
                  number: 8081
          - path: /test
            pathType: Prefix
            backend:
              service:
                name: mysv-cip
                port:
                  number: 8081