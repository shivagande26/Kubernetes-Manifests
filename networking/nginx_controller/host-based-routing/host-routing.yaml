apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dev-ingress
  labels:
    name: dg-ingress
spec:
  ingressClassName: nginx
  rules:
    - host: doctor.myappstore.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: doctorapp-svc
                port:
                  number: 8081
    - host: gym.myappstore.co.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gymapp-svc
                port:
                  number: 8081











