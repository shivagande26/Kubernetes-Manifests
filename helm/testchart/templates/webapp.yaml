apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngiapp-{{ .Release.Name }}
  labels:
{{- include "deploy.labels" . | indent 4 }}
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: webapp
    spec:
      containers:
        - name: mywebapp
          {{- with .Values.deploy.webapp }}
          image: nginx:{{ .imageTag }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      type: webapp