{{- if .Values.hpa.apply }}
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ngiapp-{{ .Release.Name }}
  {{- with .Values.hpa.webapp }}
  minReplicas: {{ .minReplicaCount }}
  maxReplicas: {{ .maxReplicaCount }}
  targetCPUUtilizationPercentage: {{ .targetCPUUtil }}
  {{- end }}
{{- end }}