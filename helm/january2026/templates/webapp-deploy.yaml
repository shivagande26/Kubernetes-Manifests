apiVersion: apps/v1
kind: Deployment
metadata:
  name: myappone-{{ .Release.Name }}
  labels:
    type: webapp
{{- include "common.labels" . | indent 4 }}
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: webapp
    spec:
      containers:
        - name: mywebapp
          {{- with .Values.webapp.deploy }}
          image: nginx:{{ .imageTag }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      type: webapp