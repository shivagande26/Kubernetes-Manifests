apiVersion: apps/v1
kind: Deployment
metadata:
  name: myappone
  labels:
{{- include "common.labels" . | indent 4 }}
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: webapp
    spec:
      containers:
        - name: mywebapp
          {{- with .Values.webapp.nginxDeploy }}
          image: nginx:{{ .imgTag }}
  replicas: {{ .replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      type: webapp