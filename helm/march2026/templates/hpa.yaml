{{- if .Values.hpa.deploy }}
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: myapp
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: myappone-{{ .Release.Name }}
  {{- with .Values.hpa }}
  minReplicas: {{ .minCount }}
  maxReplicas: {{ .maxCount }}
  targetCPUUtilizationPercentage: {{ .targetCPUUtil }}
  {{- end }}
{{- end }}