apiVersion: v1
kind: Pod
metadata:
  name: static-webapp-{{ .Release.Name }}
  labels:
    type: frontend
{{- include "app.tags" . | indent 4 }}
spec:
  containers:
    - name: app
      {{- with .Values.apps.webapp }}
      image: nginx:{{ .imgTag }}
      ports:
        - containerPort: {{ .containerPort }}
      {{- end }}