apiVersion: apps/v1
kind: Deployment
metadata:
  name: myappone
  labels:
    type: webapp
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: webapp
    spec:
      nodeName: ip-192-168-10-25.ec2.internal
      containers:
        - name: mywebapp
          image: nginx
  replicas: 10
  selector:
    matchLabels:
      type: webapp