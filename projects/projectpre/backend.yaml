apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastore-backend
  labels:
    type: backend
spec:
  template:
    metadata:
      name: datastore-backend
      labels:
        type: backend
    spec:
      containers:
        - name: datastore-backend
          image: 8072388539/datastore-be-new:v2
          env:
            - name: MYSQL_HOST
              value: jdbc:mysql://database-1.ckn8ua44i6hk.us-east-1.rds.amazonaws.com:3306/datastore?createDatabaseIfNotExist=true
            - name: MYSQL_USERNAME
              value: root
            - name: MYSQL_PASSWORD
              value: shivakumar
  replicas: 1
  selector:
    matchLabels:
      type: backend

---

apiVersion: v1
kind: Service
metadata:
  name: datastore-be-svc
spec:
  ports:
    - port: 8081
      targetPort: 8084
  selector:
    type: backend