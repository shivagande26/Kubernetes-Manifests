apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastore-frontend
  labels:
    type: frontend
spec:
  template:
    metadata:
      name: datastore-frontend
      labels:
        type: frontend
    spec:
      containers:
        - name: mywebapp
          image: 8072388539/datastore-fe-new:v2
          env:
            - name: API_URL
              value: http://datastore-be-svc:8081
  replicas: 3
  selector:
    matchLabels:
      type: frontend

---

apiVersion: v1
kind: Service
metadata:
  name: datastore-fe-svc
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8080
  selector:
    type: frontend