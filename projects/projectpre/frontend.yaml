apiVersion: apps/v1
kind: Deployment
metadata:
  name: datastore-frontend
  labels:
    type: frontend
spec:
  template:
    metadata:
      name: datastore-frontend
      labels:
        type: frontend
    spec:
      containers:
        - name: mywebapp
          image: 095706880412.dkr.ecr.us-east-1.amazonaws.com/datastore-frontend-app:v35.0
          env:
            - name: API_URL
              value: http://datastore-backend-svc.default.svc.cluster.local:8081
  replicas: 3
  selector:
    matchLabels:
      type: frontend

---

apiVersion: v1
kind: Service
metadata:
  name: datastore-frontend-svc
spec:
  type: LoadBalancer
  ports:
    - port: 8081
      targetPort: 8080
  selector:
    type: frontend