apiVersion: apps/v1
kind: Deployment
metadata:
  name: doctor-app
  labels:
    type: doctor-webapp
    app: test
spec:
  template:
    metadata:
      name: myapp-pod
      labels:
        type: doctor-webapp
    spec:
      containers:
        - name: mywebapp
          image: 8072388539/doctorapp:v1
          ports:
            - containerPort: 80
  replicas: 3
  selector:
    matchLabels:
      type: doctor-webapp